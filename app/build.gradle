plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maowu.gravitypet'
    compileSdk 36
    buildToolsVersion '36.0.0'

    // Keep upstream code available for comparison, without shipping its retired cloud/UI paths.
    sourceSets {
        main.java.setSrcDirs(['src/main/java/com/maowu/gravitypet/gengpet'])
        main.res.setSrcDirs(['src/gengpet/res'])
    }

    defaultConfig {
        applicationId "com.maowu.gengpet"
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName "0.1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {}
